<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f6f8; margin: 0; padding: 20px; }
    .container { background-color: #ffffff; padding: 30px; border-radius: 8px; max-width: 600px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .header { font-size: 20px; font-weight: bold; color: #1e3a8a; margin-bottom: 20px; }
    .code { font-size: 28px; font-weight: bold; color: #2563eb; letter-spacing: 4px; padding: 15px; background: #eff6ff; display: inline-block; border-radius: 6px; margin: 15px 0; }
    .footer { font-size: 12px; color: #6b7280; margin-top: 30px; border-top: 1px solid #e5e7eb; padding-top: 15px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">EUROTECH SERVICES - Təsdiq Kodu</div>
    <p>Hörmətlidir müştəri,</p>
    <p>Hesabınıza daxil olmaq və ya qeydiyyatı tamamlamaq üçün Təsdiq (OTP) kodunuz:</p>
    <div class="code">{{otpCode}}</div>
    <p>Bu kod 10 dəqiqə ərzində etibarlıdır. Kodu heç kimlə paylaşmayın.</p>
    <div class="footer">
      &copy; 2026 EuroTech Services Kft. Budapeşt & Bakı. Bütün hüquqlar qorunur.
    </div>
  </div>
</body>
</html>
